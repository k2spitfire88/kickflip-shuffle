<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Kickflip Shuffle — skater kickflipping over a drum kit, MxPx Panic-inspired">
  <defs>
    <radialGradient id="wall" cx="46%" cy="40%" r="80%">
      <stop offset="0%"  stop-color="#E2B84A"/>
      <stop offset="48%" stop-color="#C99A33"/>
      <stop offset="100%" stop-color="#6e521a"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="grime" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.04  0 0 0 0 0.01  0 0 0 0.9 0"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="3" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="roughHard">
      <feTurbulence type="turbulence" baseFrequency="0.04 0.06" numOctaves="2" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <circle cx="3" cy="3" r="1.5" fill="#000000" fill-opacity="0.16"/>
    </pattern>
    <pattern id="scratch" width="14" height="14" patternTransform="rotate(-34)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#000000" stroke-opacity="0.07" stroke-width="1.4"/>
    </pattern>
    <radialGradient id="redblob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0341F"/><stop offset="100%" stop-color="#9c1d10"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F2EFE6"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1024" height="1024" fill="url(#wall)"/>
  <rect width="1024" height="1024" fill="url(#halftone)"/>
  <rect width="1024" height="1024" filter="url(#grime)" opacity="0.55"/>
  <rect width="1024" height="1024" fill="url(#scratch)"/>

  <!-- LONG CAST SHADOW -->
  <g filter="url(#rough)" opacity="0.48">
    <g transform="translate(372 920) skewX(-54) scale(1.05 0.3)">
      <circle cx="220" cy="-250" r="46"/>
      <path d="M220 -206 L196 -60" stroke="#0d0b07" stroke-width="50" stroke-linecap="round" fill="none"/>
      <path d="M210 -150 L300 -120 L300 -40" stroke="#0d0b07" stroke-width="34" stroke-linecap="round" fill="none"/>
      <path d="M210 -150 L120 -120 L120 -40" stroke="#0d0b07" stroke-width="34" stroke-linecap="round" fill="none"/>
      <path d="M214 -188 L320 -210 L370 -250" stroke="#0d0b07" stroke-width="30" stroke-linecap="round" fill="none"/>
      <path d="M214 -184 L110 -206 L66 -262" stroke="#0d0b07" stroke-width="30" stroke-linecap="round" fill="none"/>
      <rect x="40" y="-46" width="360" height="52" fill="#0d0b07"/>
    </g>
  </g>

  <!-- ============ DRUM KIT (shrunk to human proportion, grounded) ============ -->
  <g transform="matrix(0.64,0,0,0.64,184,364)">
  <!-- stands -->
  <g filter="url(#roughHard)" stroke="#0d0b07" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- hi-hat -->
    <line x1="214" y1="600" x2="214" y2="858"/><line x1="214" y1="858" x2="180" y2="930"/><line x1="214" y1="858" x2="214" y2="936"/><line x1="214" y1="858" x2="252" y2="930"/>
    <!-- crash boom (upper-left) -->
    <line x1="358" y1="452" x2="332" y2="884"/><line x1="332" y1="884" x2="296" y2="948"/><line x1="332" y1="884" x2="372" y2="948"/>
    <!-- ride (upper-right) -->
    <line x1="712" y1="498" x2="752" y2="884"/><line x1="752" y1="884" x2="716" y2="948"/><line x1="752" y1="884" x2="792" y2="948"/>
    <!-- snare stand -->
    <line x1="300" y1="780" x2="290" y2="900"/><line x1="290" y1="900" x2="256" y2="952"/><line x1="290" y1="900" x2="326" y2="952"/>
  </g>

  <!-- cymbals (tilted) -->
  <g filter="url(#roughHard)">
    <g transform="rotate(-14 214 556)">
      <ellipse cx="214" cy="556" rx="98" ry="20" fill="#0d0b07"/>
      <ellipse cx="214" cy="556" rx="98" ry="20" fill="none" stroke="#E2B84A" stroke-width="3" stroke-opacity="0.6"/>
      <ellipse cx="214" cy="556" rx="18" ry="6" fill="#1a1408"/>
    </g>
    <g transform="rotate(-16 214 580)"><ellipse cx="214" cy="580" rx="96" ry="18" fill="#0d0b07"/></g>
    <g transform="rotate(-18 358 446)">
      <ellipse cx="358" cy="446" rx="112" ry="22" fill="#0d0b07"/>
      <ellipse cx="358" cy="446" rx="112" ry="22" fill="none" stroke="#E2B84A" stroke-width="3" stroke-opacity="0.6"/>
      <ellipse cx="358" cy="446" rx="20" ry="6" fill="#1a1408"/>
    </g>
    <g transform="rotate(13 712 492)">
      <ellipse cx="712" cy="492" rx="126" ry="24" fill="#0d0b07"/>
      <ellipse cx="712" cy="492" rx="126" ry="24" fill="none" stroke="#E2B84A" stroke-width="3" stroke-opacity="0.6"/>
      <ellipse cx="712" cy="492" rx="22" ry="7" fill="#1a1408"/>
    </g>
  </g>

  <!-- KICK (center, front-facing) with toms mounted + floor tom -->
  <g filter="url(#roughHard)">
    <!-- mounts -->
    <g stroke="#0d0b07" stroke-width="9"><line x1="470" y1="690" x2="452" y2="636"/><line x1="554" y1="690" x2="572" y2="636"/></g>

    <!-- floor tom (right, on legs) -->
    <g>
      <line x1="690" y1="792" x2="676" y2="900" stroke="#0d0b07" stroke-width="8"/>
      <line x1="800" y1="792" x2="814" y2="900" stroke="#0d0b07" stroke-width="8"/>
      <path d="M674 760 l0 96 a72 26 0 0 0 144 0 l0 -96 z" fill="#0d0b07"/>
      <ellipse cx="746" cy="760" rx="72" ry="26" fill="#1a1408" stroke="#E8E2D2" stroke-width="5"/>
      <ellipse cx="746" cy="760" rx="72" ry="26" fill="none" stroke="#C42B1E" stroke-width="3"/>
    </g>

    <!-- kick shell + heads -->
    <ellipse cx="512" cy="822" rx="190" ry="186" fill="#0d0b07"/>
    <ellipse cx="512" cy="822" rx="158" ry="154" fill="none" stroke="#E8E2D2" stroke-width="6"/>
    <ellipse cx="512" cy="822" rx="158" ry="154" fill="none" stroke="#C42B1E" stroke-width="2" stroke-opacity="0.7"/>
    <ellipse cx="512" cy="860" rx="46" ry="44" fill="#1a1408" stroke="#928e86" stroke-width="3"/>
    <!-- lugs -->
    <g fill="#E8E2D2" opacity="0.5"><circle cx="512" cy="672" r="5"/><circle cx="620" cy="712" r="5"/><circle cx="404" cy="712" r="5"/><circle cx="664" cy="822" r="5"/><circle cx="360" cy="822" r="5"/></g>
    <!-- spurs + pedal -->
    <line x1="372" y1="930" x2="338" y2="990" stroke="#0d0b07" stroke-width="9" stroke-linecap="round"/>
    <line x1="652" y1="930" x2="686" y2="990" stroke="#0d0b07" stroke-width="9" stroke-linecap="round"/>
    <rect x="494" y="980" width="36" height="16" rx="4" fill="#0d0b07"/>

    <!-- rack toms (cylinders w/ depth) -->
    <g>
      <path d="M404 616 l0 72 a58 22 0 0 0 116 0 l0 -72 z" fill="#0d0b07"/>
      <ellipse cx="462" cy="616" rx="58" ry="22" fill="#1a1408" stroke="#E8E2D2" stroke-width="5"/>
      <ellipse cx="462" cy="616" rx="58" ry="22" fill="none" stroke="#C42B1E" stroke-width="3"/>
    </g>
    <g>
      <path d="M504 614 l0 72 a58 22 0 0 0 116 0 l0 -72 z" fill="#0d0b07"/>
      <ellipse cx="562" cy="614" rx="58" ry="22" fill="#1a1408" stroke="#E8E2D2" stroke-width="5"/>
      <ellipse cx="562" cy="614" rx="58" ry="22" fill="none" stroke="#C42B1E" stroke-width="3"/>
    </g>
  </g>

  <!-- snare (front-left, cylinder) -->
  <g filter="url(#roughHard)">
    <path d="M226 754 l0 44 a74 26 0 0 0 148 0 l0 -44 z" fill="#0d0b07"/>
    <ellipse cx="300" cy="754" rx="74" ry="26" fill="#E8E2D2"/>
    <ellipse cx="300" cy="754" rx="74" ry="26" fill="none" stroke="#0d0b07" stroke-width="4"/>
    <ellipse cx="300" cy="754" rx="74" ry="26" fill="none" stroke="#C42B1E" stroke-width="3" stroke-dasharray="2 6"/>
  </g>

  </g><!-- /kit -->

  <!-- ============ KICKFLIP + SKATER (enlarged hero, ~2x kick width tall) ============ -->
  <g transform="matrix(1.3,0,0,1.3,-156,-40)">
  <!-- ghost frames + spin arc + board -->
  <!-- ghost board frames (flip in progress) -->
  <g filter="url(#roughHard)" fill="#0d0b07">
    <g opacity="0.18" transform="rotate(58 512 556)"><rect x="404" y="544" width="216" height="26" rx="13"/></g>
    <g opacity="0.30" transform="rotate(14 512 552)"><rect x="404" y="540" width="216" height="26" rx="13"/></g>
  </g>
  <!-- spin arc around board -->
  <g filter="url(#rough)" fill="none" stroke="#F2EFE6" stroke-width="6" opacity="0.9">
    <path d="M398 506 A 130 78 0 1 0 470 470" marker-end="url(#arrow)" stroke-dasharray="2 16" stroke-linecap="round"/>
  </g>
  <!-- main board (mid-flip, three-quarter, showing deck thickness) -->
  <g filter="url(#roughHard)" transform="rotate(-30 512 548)">
    <circle cx="430" cy="566" r="13" fill="#C42B1E"/>
    <circle cx="594" cy="566" r="13" fill="#C42B1E"/>
    <!-- deck thickness -->
    <rect x="396" y="540" width="232" height="14" rx="7" fill="#0d0b07"/>
    <!-- deck face (grip) -->
    <rect x="396" y="524" width="232" height="20" rx="10" fill="#15110a"/>
    <!-- underside stripe -->
    <rect x="408" y="544" width="208" height="8" rx="4" fill="#E0341F" opacity="0.9"/>
  </g>

  <!-- RED MISREGISTER GHOST of skater -->
  <g filter="url(#rough)" stroke="#C42B1E" fill="#C42B1E" opacity="0.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(8 -5)">
    <circle cx="520" cy="302" r="40" stroke="none"/>
    <path d="M486 306 C486 262 544 256 568 282 C576 292 574 304 568 310 Z" stroke="none"/>
    <path d="M488 300 L450 306 L450 318 L490 314 Z" stroke="none"/>
    <path d="M472 348 L568 342 L548 472 L492 472 Z" stroke="none"/>
    <path d="M558 352 L630 372 L668 346" fill="none" stroke-width="34"/>
    <path d="M484 354 L418 376 L384 342" fill="none" stroke-width="34"/>
    <circle cx="670" cy="344" r="15" stroke="none"/>
    <circle cx="382" cy="340" r="15" stroke="none"/>
    <path d="M512 464 L604 490 L620 546" fill="none" stroke-width="40"/>
    <path d="M506 466 L440 502 L472 562" fill="none" stroke-width="40"/>
    <path d="M598 540 Q636 532 664 544 Q672 548 670 560 L666 566 Q636 572 604 566 Q594 562 594 552 Z" stroke="none"/>
    <path d="M442 556 Q480 548 508 560 Q516 564 514 576 L510 582 Q480 588 448 582 Q438 578 438 568 Z" stroke="none"/>
  </g>

  <!-- SKATER (chunky silhouette: hoodie, backwards cap, Vans) -->
  <g filter="url(#rough)" fill="#0d0b07" stroke="#0d0b07" stroke-linecap="round" stroke-linejoin="round">
    <!-- head + backwards snapback (crown, back-pointing bill, button) -->
    <circle cx="520" cy="302" r="40" stroke="none"/>
    <path d="M486 306 C486 262 544 256 568 282 C576 292 574 304 568 310 Z" stroke="none"/>
    <path d="M488 300 L450 306 L450 318 L490 314 Z" stroke="none"/>
    <circle cx="532" cy="266" r="5" stroke="none"/>
    <!-- hoodie torso -->
    <path d="M472 348 L568 342 L548 472 L492 472 Z" stroke="none"/>
    <!-- arms thrown for balance -->
    <path d="M558 352 L630 372 L668 346" fill="none" stroke-width="34"/>
    <path d="M484 354 L418 376 L384 342" fill="none" stroke-width="34"/>
    <circle cx="670" cy="344" r="15" stroke="none"/>
    <circle cx="382" cy="340" r="15" stroke="none"/>
    <!-- legs splayed (front kicked out, back tucked) -->
    <path d="M512 464 L604 490 L620 546" fill="none" stroke-width="40"/>
    <path d="M506 466 L440 502 L472 562" fill="none" stroke-width="40"/>
    <!-- Vans low-tops: black upper + thin aligned cream sole (same #rough filter) -->
    <path d="M598 540 Q636 532 664 544 Q672 548 670 560 L666 566 Q636 572 604 566 Q594 562 594 552 Z" stroke="none"/>
    <path d="M442 556 Q480 548 508 560 Q516 564 514 576 L510 582 Q480 588 448 582 Q438 578 438 568 Z" stroke="none"/>
    <path d="M600 564 L666 566 L666 573 Q666 577 659 577 L606 573 Q598 572 596 566 Z" fill="#E8E2D2" stroke="none"/>
    <path d="M444 580 L512 582 L512 589 Q512 593 505 593 L450 589 Q442 588 440 582 Z" fill="#E8E2D2" stroke="none"/>
  </g>
  <!-- foot-flick speed lines (front foot) -->
  <g filter="url(#roughHard)" stroke="#F2EFE6" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="636" y1="520" x2="690" y2="506"/>
    <line x1="640" y1="536" x2="704" y2="528"/>
    <line x1="628" y1="552" x2="678" y2="552"/>
  </g>

  <!-- SCATTER / DISINTEGRATION -->
  <g filter="url(#roughHard)">
    <g fill="#0d0b07">
      <path d="M664 320 l26 -8 l-6 24 z"/><path d="M706 372 l30 -4 l-10 26 z"/><path d="M726 300 l22 -12 l2 24 z"/>
      <path d="M760 360 l24 10 l-22 14 z"/>
      <path d="M770 268 q14 -12 28 0 q14 -12 28 0" stroke="#0d0b07" stroke-width="5" fill="none"/>
      <path d="M812 318 q11 -9 22 0 q11 -9 22 0" stroke="#0d0b07" stroke-width="4" fill="none"/>
      <path d="M736 220 q12 -10 24 0 q12 -10 24 0" stroke="#0d0b07" stroke-width="4" fill="none"/>
    </g>
    <g fill="url(#redblob)">
      <circle cx="690" cy="352" r="9"/><circle cx="738" cy="396" r="6"/><circle cx="714" cy="300" r="7"/><circle cx="654" cy="392" r="5"/>
      <path d="M766 368 l16 -2 l-4 16 z"/>
    </g>
  </g>
  <g fill="url(#redblob)" filter="url(#roughHard)" opacity="0.95">
    <circle cx="170" cy="420" r="10"/><circle cx="196" cy="442" r="5"/><circle cx="868" cy="600" r="9"/><circle cx="894" cy="576" r="4"/>
  </g>

  </g><!-- /skater -->

  <!-- TORN LOGO -->
  <g filter="url(#rough)" transform="rotate(-3 300 150)">
    <rect x="92" y="92" width="470" height="118" fill="#15110a"/>
    <rect x="92" y="92" width="470" height="118" fill="#000000" opacity="0.25"/>
  </g>
  <text x="120" y="186" transform="rotate(-3 300 150)" font-family="'Saira Stencil One','Arial Black',sans-serif" font-size="104" fill="#F2EFE6" letter-spacing="1" filter="url(#roughHard)">KICKFLIP</text>
  <g fill="#C42B1E" filter="url(#roughHard)" transform="rotate(-3 300 150)">
    <rect x="150" y="200" width="7" height="34" rx="3"/><rect x="300" y="202" width="6" height="26" rx="3"/><rect x="470" y="200" width="7" height="40" rx="3"/>
  </g>
  <g filter="url(#roughHard)" transform="rotate(-3 300 150)"><rect x="150" y="226" width="356" height="58" fill="#0d0b07"/></g>
  <text x="328" y="268" text-anchor="middle" transform="rotate(-3 300 150)" font-family="'Special Elite','Courier New',monospace" font-size="40" fill="#E2B84A" letter-spacing="18" filter="url(#roughHard)">SHUFFLE</text>

  <!-- OVERLAYS -->
  <rect width="1024" height="1024" fill="url(#vig)"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.2" style="mix-blend-mode:multiply"/>
  <rect x="8" y="8" width="1008" height="1008" fill="none" stroke="#0d0b07" stroke-width="10" filter="url(#rough)" opacity="0.7"/>
</svg>
