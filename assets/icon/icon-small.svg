<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Kickflip Shuffle small icon — drum kit">
  <defs>
    <radialGradient id="wall" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#E2B84A"/><stop offset="55%" stop-color="#C99A33"/><stop offset="100%" stop-color="#7a5c1d"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="60%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- rounded amber tile -->
  <rect x="0" y="0" width="256" height="256" rx="44" fill="url(#wall)"/>

  <!-- stands -->
  <g stroke="#0d0b07" stroke-width="6" stroke-linecap="round">
    <line x1="64" y1="104" x2="58" y2="206"/><line x1="58" y1="206" x2="40" y2="232"/><line x1="58" y1="206" x2="78" y2="232"/>
    <line x1="196" y1="92" x2="206" y2="206"/><line x1="206" y1="206" x2="188" y2="232"/><line x1="206" y1="206" x2="226" y2="232"/>
  </g>

  <!-- cymbals (tilted) -->
  <g>
    <g transform="rotate(-15 64 98)"><ellipse cx="64" cy="98" rx="46" ry="11" fill="#0d0b07"/><ellipse cx="64" cy="98" rx="9" ry="3" fill="#1a1408"/></g>
    <g transform="rotate(14 196 86)"><ellipse cx="196" cy="86" rx="54" ry="12" fill="#0d0b07"/><ellipse cx="196" cy="86" rx="10" ry="3" fill="#1a1408"/></g>
  </g>

  <!-- snare (left) -->
  <g>
    <path d="M30 150 l0 22 a30 11 0 0 0 60 0 l0 -22 z" fill="#0d0b07"/>
    <ellipse cx="60" cy="150" rx="30" ry="11" fill="#E8E2D2" stroke="#0d0b07" stroke-width="3"/>
    <ellipse cx="60" cy="150" rx="30" ry="11" fill="none" stroke="#C42B1E" stroke-width="2" stroke-dasharray="2 5"/>
  </g>
  <!-- floor tom (right) -->
  <g>
    <path d="M168 150 l0 30 a32 12 0 0 0 64 0 l0 -30 z" fill="#0d0b07"/>
    <ellipse cx="200" cy="150" rx="32" ry="12" fill="#1a1408" stroke="#E8E2D2" stroke-width="3"/>
    <ellipse cx="200" cy="150" rx="32" ry="12" fill="none" stroke="#C42B1E" stroke-width="2"/>
  </g>

  <!-- KICK (hero, center) -->
  <g>
    <circle cx="128" cy="176" r="78" fill="#0d0b07"/>
    <circle cx="128" cy="176" r="62" fill="none" stroke="#E8E2D2" stroke-width="5"/>
    <circle cx="128" cy="176" r="62" fill="none" stroke="#C42B1E" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="128" cy="192" r="18" fill="#1a1408" stroke="#928e86" stroke-width="2"/>
    <!-- spurs -->
    <line x1="66" y1="216" x2="52" y2="244" stroke="#0d0b07" stroke-width="7" stroke-linecap="round"/>
    <line x1="190" y1="216" x2="204" y2="244" stroke="#0d0b07" stroke-width="7" stroke-linecap="round"/>
    <!-- skate nod: tiny board across the kick -->
    <g transform="rotate(-20 128 150)">
      <rect x="92" y="142" width="72" height="11" rx="5" fill="#C42B1E"/>
      <circle cx="104" cy="156" r="4" fill="#E8E2D2"/><circle cx="152" cy="156" r="4" fill="#E8E2D2"/>
    </g>
  </g>

  <rect x="0" y="0" width="256" height="256" rx="44" fill="url(#vig)"/>
</svg>
